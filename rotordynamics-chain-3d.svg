<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d"><title id="t">Rotordynamics analysis chain 3D</title><desc id="d">Four blocks from FE beam to unbalance response and stability</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1000" height="500" rx="18" fill="url(#bg)"/><polygon points="150.0,204.0 227.9,249.0 150.0,294.0 72.1,249.0" fill="#42dfff" stroke="#0b1220" stroke-width="1" fill-opacity="1" stroke-linejoin="round"/><polygon points="227.9,295.0 150.0,340.0 150.0,294.0 227.9,249.0" fill="#2b93c1" stroke="#0b1220" stroke-width="1" fill-opacity="1" stroke-linejoin="round"/><polygon points="72.1,295.0 150.0,340.0 150.0,294.0 72.1,249.0" fill="#35b3eb" stroke="#0b1220" stroke-width="1" fill-opacity="1" stroke-linejoin="round"/><polygon points="375.2,190.0 453.1,235.0 375.2,280.0 297.2,235.0" fill="#c5a4ff" stroke="#0b1220" stroke-width="1" fill-opacity="1" stroke-linejoin="round"/><polygon points="453.1,295.0 375.2,340.0 375.2,280.0 453.1,235.0" fill="#826cc3" stroke="#0b1220" stroke-width="1" fill-opacity="1" stroke-linejoin="round"/><polygon points="297.2,295.0 375.2,340.0 375.2,280.0 297.2,235.0" fill="#9e84ed" stroke="#0b1220" stroke-width="1" fill-opacity="1" stroke-linejoin="round"/><polygon points="600.3,176.0 678.3,221.0 600.3,266.0 522.4,221.0" fill="#3df8b4" stroke="#0b1220" stroke-width="1" fill-opacity="1" stroke-linejoin="round"/><polygon points="678.3,295.0 600.3,340.0 600.3,266.0 678.3,221.0" fill="#28a477" stroke="#0b1220" stroke-width="1" fill-opacity="1" stroke-linejoin="round"/><polygon points="522.4,295.0 600.3,340.0 600.3,266.0 522.4,221.0" fill="#31c891" stroke="#0b1220" stroke-width="1" fill-opacity="1" stroke-linejoin="round"/><polygon points="825.5,162.0 903.4,207.0 825.5,252.0 747.6,207.0" fill="#ffe12a" stroke="#0b1220" stroke-width="1" fill-opacity="1" stroke-linejoin="round"/><polygon points="903.4,295.0 825.5,340.0 825.5,252.0 903.4,207.0" fill="#c3941c" stroke="#0b1220" stroke-width="1" fill-opacity="1" stroke-linejoin="round"/><polygon points="747.6,295.0 825.5,340.0 825.5,252.0 747.6,207.0" fill="#eeb522" stroke="#0b1220" stroke-width="1" fill-opacity="1" stroke-linejoin="round"/><text x="36.0" y="44.0" font-size="24" fill="#f8fafc" text-anchor="start" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">Rotordynamics Analysis Chain</text><text x="36.0" y="68.0" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">From Euler–Bernoulli FE to Timoshenko gyroscopic model, bearing coefficients and stability (educational, linear)</text><text x="150.0" y="372.0" font-size="14.5" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">FE beam modes</text><text x="150.0" y="392.0" font-size="11.5" fill="#cbd5e1" text-anchor="middle" font-weight="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">Euler–Bernoulli, end springs</text><text x="150.0" y="410.0" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">natural frequencies, mode shapes</text><line x1="235.9" y1="285.0" x2="289.2" y2="285.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="375.2" y="372.0" font-size="14.5" fill="#a78bfa" text-anchor="middle" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">Timoshenko + gyroscopic</text><text x="375.2" y="392.0" font-size="11.5" fill="#cbd5e1" text-anchor="middle" font-weight="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">shear, rotary inertia, disk</text><text x="375.2" y="410.0" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">Campbell diagram, critical speeds</text><line x1="461.1" y1="285.0" x2="514.4" y2="285.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="600.3" y="372.0" font-size="14.5" fill="#34d399" text-anchor="middle" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">Bearing coefficients</text><text x="600.3" y="392.0" font-size="11.5" fill="#cbd5e1" text-anchor="middle" font-weight="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">Kxx Kyy Kxy Kyx · Cxx Cyy Cxy Cyx</text><text x="600.3" y="410.0" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">user-supplied, linearized</text><line x1="686.3" y1="285.0" x2="739.6" y2="285.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="825.5" y="372.0" font-size="14.5" fill="#fbbf24" text-anchor="middle" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">Response &amp; stability</text><text x="825.5" y="392.0" font-size="11.5" fill="#cbd5e1" text-anchor="middle" font-weight="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">1X unbalance, eigenvalue sweep</text><text x="825.5" y="410.0" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">damping ratio, log decrement</text><text x="36.0" y="476.0" font-size="12.5" fill="#94a3b8" text-anchor="start" font-weight="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">Linear educational model. Not a certified rotor design solver; bearing coefficients are inputs, not Reynolds-equation results.</text></svg>